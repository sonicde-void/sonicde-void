name: Check for updates
run-name: "Automated update @${{ github.repository_owner }}[bot]"

on:
  schedule:
    - cron: '59 23 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      repository:
        description: |-
          Location of the GitHub repository containing the package descriptions
          in the form of [HOST/]OWNER/REPO.
        type: string
        default: ${{ vars.PACKAGES_REPOSITORY }}

jobs:
  update-all:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Authenticate via app
        id: app-token
        if: ${{ vars.APP_CLIENT_ID }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout unstable branch
        uses: actions/checkout@v4
        with:
          ref: unstable
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Check for updates
        id: check-updates
        run: |
          chmod +x scripts/check_updates.sh
          ./scripts/check_updates.sh

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          else
            echo "No updates found"
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updates
        if: steps.check-updates.outputs.has_updates == 'true'
        run: |
          BRANCH="automated-update-$(date +%Y%m%d-%H%M%S)"

          git config --global user.name "${{ github.repository_owner }}[bot]"
          git config --global user.email "${{ vars.APP_CLIENT_ID }}+${{ github.repository_owner }}[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"

          git add srcpkgs
          git commit -m "Automated Sonic-DE package updates"

          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Push updates
        if: ${{ steps.check-updates.outputs.has_updates == 'true' }}
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          branch: ${{ env.BRANCH }}

      - name: Create pull request
        if: steps.check-updates.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr create \
            --base unstable \
            --head "${{ env.BRANCH }}" \
            --title "Automated Sonic-DE package updates" \
            --body "This PR was automatically generated by the package updater workflow."
